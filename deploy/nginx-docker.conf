worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Global per-IP temporary chat cap for public testing.
    # 1r/m with burst=4 allows up to 5 immediate chat requests,
    # then returns 429 until tokens refill.
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=1r/m;

    upstream rag_backend {
        # Session affinity: SessionStore is per-process, so a client must keep
        # hitting the same replica or its session 404s. Known limits:
        #   - clients sharing a NAT/CDN egress IP all pin to one replica
        #   - a replica restart drops its sessions (clients re-create on 404)
        # If either becomes a real problem, move to a shared session store --
        # do not go back to a different balancing algorithm.
        hash $binary_remote_addr consistent;
        server rag-api-1:8000;
        server rag-api-2:8000;
        server rag-api-3:8000;
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 2m;

        # CORS headers must be present even on limiter rejections (429).
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;

        # Handle browser preflight at edge to avoid backend dependency.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Enforce chat cap on both normal and streaming chat routes.
        location = /api/chat {
            limit_req zone=chat_limit burst=4 nodelay;
            limit_req_status 429;
            proxy_pass http://rag_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /api/chat/stream {
            limit_req zone=chat_limit burst=4 nodelay;
            limit_req_status 429;
            proxy_pass http://rag_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            proxy_pass http://rag_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
