services:
  rag-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Every replica gets every key. Pinning one key per replica made the
      # key-pool failover dead code: with a single key the retry loop in
      # _invoke_with_key_failover has nothing to fail over to, so one 429
      # took the replica out until the cooldown expired. KeyPool tracks busy
      # state per key, so sharing the pool is safe.
      GROQ_API_KEYS: ${GROQ_API_KEY_1},${GROQ_API_KEY_2},${GROQ_API_KEY_3}
    restart: unless-stopped
    volumes:
      - ./.index_cache:/app/.index_cache
      - ./logs:/app/logs
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 600s

  rag-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      GROQ_API_KEYS: ${GROQ_API_KEY_1},${GROQ_API_KEY_2},${GROQ_API_KEY_3}
    restart: unless-stopped
    volumes:
      - ./.index_cache:/app/.index_cache
      - ./logs:/app/logs
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 600s

  rag-api-3:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      GROQ_API_KEYS: ${GROQ_API_KEY_1},${GROQ_API_KEY_2},${GROQ_API_KEY_3}
    restart: unless-stopped
    volumes:
      - ./.index_cache:/app/.index_cache
      - ./logs:/app/logs
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 600s

  nginx:
    image: nginx:1.27-alpine
    container_name: sahrdaya-rag-nginx
    depends_on:
      rag-api-1:
        condition: service_healthy
      rag-api-2:
        condition: service_healthy
      rag-api-3:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/nginx.conf:ro
